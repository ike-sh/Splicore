# Optional profile for the existing splicore.service. Install explicitly as
# /etc/systemd/system/splicore.service.d/20-tun.conf before enabling TUN.
# Keep the dedicated splicore UID; applications using that UID bypass capture.
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
