name: Native Windows DNS bind controls

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dns-bind-forensics.yml
      - scripts/qualification/dns-bind-forensics.py
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'
  GOFLAGS: -mod=readonly
  GOMAXPROCS: '4'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bounded-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Populate fixed modules before native evidence capture
        shell: bash
        run: go mod download
      - name: Execute thirteen registered cases without rerunning failed samples
        shell: bash
        run: python scripts/qualification/dns-bind-forensics.py --output "$RUNNER_TEMP/p39-dns"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p39-dns-${{ runner.arch }}
          path: ${{ runner.temp }}/p39-dns/
          if-no-files-found: warn
          retention-days: 30
