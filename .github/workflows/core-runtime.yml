name: Core runtime

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/restore-*']

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify local guard behavior
        run: python -m unittest discover -s scripts/dev -p 'test_*.py'
      - name: Verify restored feature inventory
        run: python scripts/dev/check-features.py
      - name: Fetch independent pinned protocol test peers
        shell: bash
        run: python scripts/dev/fetch-restoration-references.py --output build/reference --github-env "$GITHUB_ENV"
      - name: Native default/full qualification and Linux Race
        shell: bash
        run: |
          target=windows-amd64
          if [[ '${{ runner.os }}' == Linux ]]; then target=linux-amd64; fi
          python scripts/release.py build --target "$target"
          if [[ '${{ runner.os }}' == Linux ]]; then
            python scripts/dev/isolated-linux.py -- python scripts/release.py qualify --target "$target"
          else
            python scripts/release.py qualify --target "$target"
          fi
      - name: Instrumented native network baseline (no performance SLO)
        shell: bash
        run: python scripts/performance/run.py --profile ci --output "$RUNNER_TEMP/splicore-performance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-qualification-${{ runner.os }}
          path: |
            build/release/qualification/
            build/reference/
            ${{ runner.temp }}/splicore-performance/
          if-no-files-found: warn
          retention-days: 14
      - name: Compile arm64 core and packages
        shell: bash
        run: |
          export GOARCH=arm64
          go build -tags with_quic,with_utls,with_gvisor ./...
