name: Core runtime

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/restore-*']

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify local guard behavior
        run: python -m unittest discover -s scripts/dev -p 'test_*.py'
      - name: Verify restored feature inventory
        run: python scripts/dev/check-features.py
      - name: Fetch independent pinned encryption test peer
        shell: bash
        run: python scripts/dev/fetch-vless-reference.py --output build/reference --github-env "$GITHUB_ENV"
      - name: Linux native core, checks and real traffic
        if: runner.os == 'Linux'
        shell: bash
        run: |
          make build
          umask 077
          runtime_tmp=$(mktemp -d /dev/shm/splicore-runtime.XXXXXX)
          trap 'rm -rf -- "$runtime_tmp"' EXIT
          export TMPDIR="$runtime_tmp" GOTMPDIR="$runtime_tmp"
          export SPLICORE_RUNTIME_BINARY="$GITHUB_WORKSPACE/build/linux-amd64/splicore"
          go vet -tags with_quic,with_utls,with_gvisor ./...
          go test -count=1 -timeout=180s -tags with_quic,with_utls,with_gvisor ./...
          CGO_ENABLED=1 go test -race -count=1 -timeout=180s -tags with_quic,with_utls,with_gvisor ./internal/splicore/... ./protocol/...
      - name: Windows native core, checks and real traffic
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/splicore-build.ps1 -Action test
          if ($LASTEXITCODE -ne 0) { throw 'Native core tests failed' }
          go vet -tags with_quic,with_utls,with_gvisor ./...
          if ($LASTEXITCODE -ne 0) { throw 'Native vet failed' }
      - name: Compile arm64 core and packages
        shell: bash
        run: |
          export GOARCH=arm64
          go build -tags with_quic,with_utls,with_gvisor ./...
