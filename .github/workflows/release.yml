name: Official release

on:
  push:
    branches: [main, 'codex/restore-*']
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      inject_failure:
        description: Run only the synthetic diagnostics failure on the native build checks
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'
  CGO_ENABLED: '0'
  GOFLAGS: -mod=readonly
  PYTHONDONTWRITEBYTECODE: '1'
  GOMAXPROCS: '4'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact source and version
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py identity > "$RUNNER_TEMP/identity.json"
          python3 - <<'PY'
          import json, os, subprocess
          m = json.load(open(os.environ['RUNNER_TEMP'] + '/identity.json'))
          assert m['commit'] == os.environ['GITHUB_SHA']
          if os.environ['EVENT_NAME'] == 'push' and os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == m['version']
              tag = subprocess.check_output(['git','rev-parse',m['version']+'^{commit}'], text=True).strip()
              assert tag == m['commit']
              subprocess.run(['git','fetch','origin','main'], check=True)
              assert subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip() == m['commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + m['version'] + '\ncommit=' + m['commit'] + '\n')
          print(json.dumps(m))
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-24.04
            native: true
          - target: windows-amd64
            os: windows-2025-vs2026
            native: true
          - target: linux-arm64
            os: ubuntu-24.04
            native: false
          - target: windows-arm64
            os: ubuntu-24.04
            native: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Record runner fingerprint
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/qualification/evidence.py fingerprint --private "$RUNNER_TEMP/splicore-private" \
            --target '${{ matrix.target }}' --label '${{ matrix.os }}' --kind '${{ inputs.inject_failure && 'injection' || 'release' }}'
      - name: Exercise synthetic failure and preserve its exit status
        if: inputs.inject_failure && matrix.native
        shell: bash
        run: python scripts/qualification/inject-failure.py --private "$RUNNER_TEMP/splicore-private"
      - name: Build exact release core and inspect format
        if: '!inputs.inject_failure'
        shell: bash
        run: python scripts/release.py build --target '${{ matrix.target }}' --evidence-dir "$RUNNER_TEMP/splicore-private/raw"
      - name: Fetch pinned independent protocol test peers
        if: matrix.native && !inputs.inject_failure
        shell: bash
        run: python scripts/dev/fetch-restoration-references.py --output "$RUNNER_TEMP/splicore-private/reference" --github-env "$GITHUB_ENV"
      - name: Native default/full builds, vet, tests and Linux race
        if: matrix.native && !inputs.inject_failure
        shell: bash
        run: |
          args=(python scripts/release.py qualify --target '${{ matrix.target }}' --evidence-dir "$RUNNER_TEMP/splicore-private/raw")
          if [[ '${{ runner.os }}' == Linux ]]; then
            python scripts/dev/isolated-linux.py -- "${args[@]}"
          else
            "${args[@]}"
          fi
      - name: Package the qualified target
        if: '!inputs.inject_failure'
        shell: bash
        run: python scripts/release.py package --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: '!inputs.inject_failure'
        with:
          name: release-transfer-${{ matrix.target }}
          path: build/release/transfer/*
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/qualification-evidence
        if: always()
        continue-on-error: true
        with:
          target: ${{ matrix.target }}
          label: ${{ matrix.os }}
          kind: ${{ inputs.inject_failure && 'injection' || 'release' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: ${{ inputs.inject_failure && 'diagnostic-injection' || 'qualification' }}-${{ matrix.target }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/splicore-public/
          if-no-files-found: warn
          retention-days: 30

  environment-diff:
    needs: [prepare, build]
    if: '!cancelled() && needs.prepare.result == ''success'' && !inputs.inject_failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare source-matched PR and current runner evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/qualification/compare-environments.py --output "$RUNNER_TEMP/splicore-compare/environment-diff.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: environment-diff-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/splicore-compare/environment-diff.json
          if-no-files-found: warn
          retention-days: 30

  assemble:
    needs: [prepare, build]
    if: '!inputs.inject_failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-transfer-*
          path: build/release/transfer
          merge-multiple: true
      - name: Verify inventory, bundle corresponding source and create checksums
        run: python3 scripts/release.py assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: |
            build/release/final/
            build/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, assemble]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: build/payload
      - name: Verify, upload a new draft, download-check, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/release.py verify --output build/payload/final
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Refusing to modify an existing Release' >&2
            exit 1
          fi
          gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$RELEASE_COMMIT" --draft --title "Splicore $RELEASE_VERSION" \
            --notes-file build/payload/RELEASE_NOTES.md build/payload/final/*
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir build/draft-download
          cmp build/payload/final/SHA256SUMS build/draft-download/SHA256SUMS
          python3 scripts/release.py verify --output build/draft-download
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  download-test:
    needs: [prepare, assemble, publish]
    if: >-
      !cancelled() && needs.assemble.result == 'success' &&
      (needs.publish.result == 'success' ||
      (needs.publish.result == 'skipped' && github.ref_type != 'tag'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-24.04
          - target: windows-amd64
            os: windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Record runner fingerprint
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/qualification/evidence.py fingerprint --private "$RUNNER_TEMP/splicore-private" \
            --target '${{ matrix.target }}' --label '${{ matrix.os }}' --kind product-smoke
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.publish.result == 'skipped'
        with:
          name: release-candidate
          path: build/downloaded-candidate
      - name: Download the public release assets
        if: needs.publish.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir build/published-download
      - name: Verify the downloaded archives and run the native core
        shell: bash
        run: |
          assets=build/downloaded-candidate/final
          if [[ '${{ needs.publish.result }}' == success ]]; then assets=build/published-download; fi
          binary=build/downloaded-core/splicore
          if [[ '${{ runner.os }}' == Windows ]]; then binary+=.exe; fi
          python scripts/release.py verify --output "$assets" --target '${{ matrix.target }}' --extract-dir build/downloaded-core
          python scripts/release.py smoke --target '${{ matrix.target }}' --runtime-binary "$binary" \
            --evidence-dir "$RUNNER_TEMP/splicore-private/raw" --output build
      - uses: ./.github/actions/qualification-evidence
        if: always()
        continue-on-error: true
        with:
          target: ${{ matrix.target }}
          label: ${{ matrix.os }}
          kind: product-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: product-smoke-${{ matrix.target }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/splicore-public/
          if-no-files-found: warn
          retention-days: 30
