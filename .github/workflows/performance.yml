name: Performance baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Record runner fingerprint
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/qualification/evidence.py fingerprint --private "$RUNNER_TEMP/splicore-private" \
            --target '${{ runner.os == 'Linux' && 'linux-amd64' || 'windows-amd64' }}' --label '${{ matrix.os }}' --kind performance
      - name: Instrumented native network baseline
        shell: bash
        run: |
          python -m unittest discover -s scripts/performance -p 'test_*.py'
          python scripts/performance/run.py --profile ci --output "$RUNNER_TEMP/splicore-private/performance"
      - uses: ./.github/actions/qualification-evidence
        if: always()
        continue-on-error: true
        with:
          target: ${{ runner.os == 'Linux' && 'linux-amd64' || 'windows-amd64' }}
          label: ${{ matrix.os }}
          kind: performance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: performance-baseline-${{ runner.os }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/splicore-public/
          if-no-files-found: warn
          retention-days: 14
