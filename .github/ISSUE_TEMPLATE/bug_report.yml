name: Core bug report
description: Report a Splicore Core problem
body:
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Linux amd64 or Windows amd64
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Splicore version and build tags
      description: Include splicore version output and the build command when built from source.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Expected behavior, actual behavior and reproduction
      description: Remove credentials, private keys, private server addresses and identifying data before sharing configuration or logs.
    validations:
      required: true
