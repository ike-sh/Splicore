name: Core 问题反馈
description: 反馈 Splicore Core 问题
body:
  - type: input
    id: platform
    attributes:
      label: 操作系统与架构
      placeholder: Linux amd64 或 Windows amd64
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Splicore 版本与 build tags
      description: 提供 splicore version 输出；从源码构建时附构建命令。
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 预期行为、实际行为与复现步骤
      description: 分享配置或日志前删除凭据、私钥、敏感服务器地址与身份信息。
    validations:
      required: true
