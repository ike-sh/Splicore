  "components": {
    "schemas": {
      "ID": {
        "type": "string",
        "format": "uuid"
      },
      "Revision": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "Counter": {
        "type": "string",
        "pattern": "^[0-9]+$",
        "description": "Nonnegative integer decimal string."
      },
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "description": "Includes unsupported_engine_feature (422), unsupported_export (422), invalid (400), not_implemented (501); messages exclude supplied secrets."
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          },
          "current_revision": {
            "$ref": "#/components/schemas/Revision"
          },
          "violations": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "path": {
                  "type": "string"
                },
                "code": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                }
              },
              "required": [
                "path",
                "code",
                "message"
              ]
            }
          }
        },
        "required": [
          "code",
          "message",
          "request_id"
        ]
      },
      "Version": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "product": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "commit": {
            "type": "string"
          },
          "build_time": {
            "type": "string"
          },
          "go_version": {
            "type": "string"
          },
          "platform": {
            "type": "string"
          },
          "upstream_tag": {
            "type": "string"
          },
          "upstream_commit": {
            "type": "string"
          },
          "channel": {
            "type": "string"
          },
          "api_version": {
            "type": "string"
          },
          "dirty": {
            "type": "boolean",
            "description": "Source worktree had uncommitted changes when built."
          },
          "source_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "build_tags": {
            "type": "string"
          }
        },
        "required": [
          "product",
          "version",
          "commit",
          "upstream_commit",
          "api_version"
        ]
      },
      "System": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "node_id": {
            "$ref": "#/components/schemas/ID"
          },
          "instance_id": {
            "$ref": "#/components/schemas/ID"
          },
          "version": {
            "$ref": "#/components/schemas/Version"
          },
          "config_schema": {
            "type": "integer"
          },
          "db_schema": {
            "type": "integer"
          },
          "protocol_abi": {
            "type": "integer"
          },
          "committed_revision": {
            "$ref": "#/components/schemas/Revision"
          },
          "applied_revision": {
            "$ref": "#/components/schemas/Revision"
          },
          "health": {
            "type": "string",
            "enum": [
              "healthy",
              "degraded",
              "recovery_required"
            ]
          },
          "reasons": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "foundation": {
            "$ref": "#/components/schemas/Foundation"
          },
          "engines": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EngineStatus"
            }
          },
          "server_runtimes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ServerRuntimeStatus"
            }
          },
          "client_runtime": {
            "$ref": "#/components/schemas/ClientRuntimeStatus"
          }
        },
        "required": [
          "node_id",
          "instance_id",
          "version",
          "config_schema",
          "db_schema",
          "protocol_abi",
          "committed_revision",
          "health",
          "engines"
        ]
      },
      "Capability": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "protocol": {
            "type": "string"
          },
          "wire_version": {
            "type": "string"
          },
          "feature_profile": {
            "type": "string"
          },
          "availability": {
            "type": "string",
            "enum": [
              "compiled",
              "not_compiled",
              "unsupported_platform"
            ]
          },
