        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^\"[0-9]+\"$"
        }
      },
      "Idempotency": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 16,
          "maxLength": 128
        }
      }
    },
    "responses": {
      "Problem": {
        "description": "Status-specific redacted error, code/request ID/current revision where applicable.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Problem"
            }
          }
        }
      }
    },
    "securitySchemes": {
      "ControlBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Future control API over TLS; subscription tokens are never accepted."
      }
    }
  }
}
